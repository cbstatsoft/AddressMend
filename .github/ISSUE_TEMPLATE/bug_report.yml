name: Bug report
description: Report a reproducible problem without sharing personal data
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve AddressMend.
        Do not include real names, addresses, email addresses, API keys,
        databases or result files. Replace them with invented examples first.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.2.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction using fictional data
      description: Include the smallest invented input and the commands or menu choices used.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have removed personal data, API keys and private files from this report.
          required: true
