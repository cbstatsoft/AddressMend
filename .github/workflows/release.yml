name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile addressmend.py scripts/build_release.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Built-in test
        run: python addressmend.py self-test
      - name: Build release assets
        run: python scripts/build_release.py --tag "${GITHUB_REF_NAME}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_title=$(sed -n '1{s/^# //;p;}' RELEASE_NOTES.md)
          gh release create "${GITHUB_REF_NAME}" \
            dist/AddressMend_*_Desktop.zip \
            dist/AddressMend_*_Repository.zip \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "${release_title}" \
            --notes-file RELEASE_NOTES.md
